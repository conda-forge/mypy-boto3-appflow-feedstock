schema_version: 1

context:
  name: mypy-boto3-appflow
  version: "1.44.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a6aac5a8b41a6aa81f4f5cfef84c877b3c11f0c515ed9b308f8b3538b42f1780

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    # for all python variants to stay noarch: python
    - typing_extensions
    - boto3
tests:
  - python:
      imports:
        - mypy_boto3_appflow
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Type annotations for boto3.Appflow 1.34.0 service generated with mypy-boto3-builder 7.21.0
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/youtype/mypy_boto3_builder
  repository: https://github.com/youtype/mypy_boto3_builder

extra:
  recipe-maintainers:
    - xylar
